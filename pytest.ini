[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --tb=short
    --strict-markers
    -v
    --color=yes

markers =
    slow: mark test as slow (deselect with -m "not slow")
    integration: requires running external services

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
