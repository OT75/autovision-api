<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="330" viewBox="0 0 1010 330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>AutoVision serving architecture</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#59636e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="60" width="190" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="125.0" y="86.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">curl / Swagger UI</text><text x="125.0" y="104.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">image or video upload</text><rect x="30" y="160" width="190" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="125.0" y="186.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Browser: /stream</text><text x="125.0" y="204.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">webcam frames via WebSocket</text><rect x="250" y="25" width="740" height="255" rx="14" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="6 5"/><text x="268" y="45" font-size="12.5" font-weight="600" fill="#59636e" text-anchor="start" dominant-baseline="central">Docker Compose: api + mlflow</text><rect x="270" y="60" width="300" height="190" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="420.0" y="121.0" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle" dominant-baseline="central">FastAPI service</text><text x="420.0" y="139.0" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">POST /predict → annotated JPEG</text><text x="420.0" y="156.0" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">POST /predict/video → annotated MP4</text><text x="420.0" y="173.0" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">WS /ws/detect → live detections</text><text x="420.0" y="190.0" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">GET /health · detections in headers</text><rect x="630" y="60" width="340" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="800.0" y="86.5" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle" dominant-baseline="central">VehicleDetector</text><text x="800.0" y="104.5" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">YOLOv8 · MODEL_SOURCE picks the model</text><rect x="630" y="170" width="160" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="710.0" y="193.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Pretrained</text><text x="710.0" y="211.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">YOLOv8n (COCO)</text><text x="710.0" y="228.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">8 classes</text><rect x="810" y="170" width="160" height="80" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="890.0" y="193.0" font-size="14" font-weight="600" fill="#116329" text-anchor="middle" dominant-baseline="central">MLflow registry</text><text x="890.0" y="211.0" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">fine-tuned model</text><text x="890.0" y="228.0" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">car · truck · bus</text><path d="M220 95 L268 95" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M220 195 L268 195" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M570 95 L628 95" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M710 130 L710 168" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M890 130 L890 168" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><text x="30" y="308" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">Upload limits: 10 MB images, 100 MB videos. The container runs as a non-root user with a health check.</text></svg>